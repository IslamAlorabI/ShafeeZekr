name: Build AAB for Play Console

on:
  workflow_dispatch:

jobs:
  bundle:
    name: Build release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]*//g')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release-key.jks

      - name: Build release AAB
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir -p play
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$AAB_PATH" "play/ShafeeZekr-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}.aab"
          # R8 mapping: upload to Play Console so crash stack traces are readable
          cp app/build/outputs/mapping/release/mapping.txt play/ 2>/dev/null || true
          cp app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip play/ 2>/dev/null || true

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ShafeeZekr-v${{ steps.version.outputs.name }}-build${{ steps.version.outputs.code }}
          path: play/
          if-no-files-found: error
